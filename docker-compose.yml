services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: momo-compressor-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - momo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: momo-compressor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - momo-network

networks:
  momo-network:
    driver: bridge
