<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Horns Gradient -->
    <linearGradient id="hornGrad" x1="30" y1="50" x2="210" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Horns Gradient Right -->
    <linearGradient id="hornGradRight" x1="150" y1="50" x2="220" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Buffalo Fur Gradient -->
    <linearGradient id="furGrad" x1="120" y1="70" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Muzzle Gradient -->
    <linearGradient id="muzzleGrad" x1="120" y1="130" x2="120" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="100" y1="165" x2="140" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Rounded Badge -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#softGlow)" stroke="#312e81" stroke-width="2"/>

  <!-- Subtle Aura Glow -->
  <circle cx="120" cy="115" r="70" fill="#6366f1" opacity="0.18" />

  <!-- Left Horn -->
  <path d="M 85 105 C 60 90 25 75 32 45 C 45 42 68 62 82 86 Z" fill="url(#hornGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Horn -->
  <path d="M 155 105 C 180 90 215 75 208 45 C 195 42 172 62 158 86 Z" fill="url(#hornGradRight)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Left Ear -->
  <path d="M 72 105 C 48 112 42 124 55 130 C 68 136 78 122 80 112 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 68 112 C 55 116 52 122 60 126 C 68 130 73 122 74 116 Z" fill="#fbcfe8" opacity="0.6"/>

  <!-- Right Ear -->
  <path d="M 168 105 C 192 112 198 124 185 130 C 172 136 162 122 160 112 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 172 112 C 185 116 188 122 180 126 C 172 130 167 122 166 116 Z" fill="#fbcfe8" opacity="0.6"/>

  <!-- Head Base -->
  <path d="M 80 90 C 80 72 160 72 160 90 C 172 110 170 145 158 170 C 146 195 94 195 82 170 C 70 145 68 110 80 90 Z" fill="url(#furGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Tuft Hair (Iconic White Buffalo Fur) -->
  <path d="M 98 75 C 105 60 118 64 120 70 C 122 62 135 62 142 75 C 136 82 104 82 98 75 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Eyes -->
  <ellipse cx="98" cy="116" rx="6.5" ry="8.5" fill="#0f172a" />
  <circle cx="100.5" cy="113.5" r="2.8" fill="#ffffff" />
  <ellipse cx="142" cy="116" rx="6.5" ry="8.5" fill="#0f172a" />
  <circle cx="144.5" cy="113.5" r="2.8" fill="#ffffff" />

  <!-- Cheeks Blush -->
  <circle cx="85" cy="132" r="8" fill="#f43f5e" opacity="0.22" />
  <circle cx="155" cy="132" r="8" fill="#f43f5e" opacity="0.22" />

  <!-- Muzzle -->
  <ellipse cx="120" cy="154" rx="32" ry="22" fill="url(#muzzleGrad)" stroke="#fb923c" stroke-width="1"/>

  <!-- Nostrils -->
  <ellipse cx="110" cy="151" rx="4" ry="5.5" fill="#7c2d12" transform="rotate(-10 110 151)"/>
  <ellipse cx="130" cy="151" rx="4" ry="5.5" fill="#7c2d12" transform="rotate(10 130 151)"/>

  <!-- Buffalo Golden Nose Ring (MoMo's Iconic Signature) -->
  <path d="M 112 160 C 112 176 128 176 128 160" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
